services:
  convert:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VITE_COMMIT_SHA: docker
    restart: unless-stopped

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.convert.rule=Host(`convert.harryisback.org`)"
      - "traefik.http.routers.convert.entrypoints=web"
      - "traefik.http.services.convert.loadbalancer.server.port=80"

    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
